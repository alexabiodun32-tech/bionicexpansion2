name: Build mod

# Runs on every push, or by hand from the Actions tab ("Run workflow").
# Download "bionicexpansion-jar" from the bottom of the finished run's page.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the jar
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bionicexpansion-jar
          path: build/libs/bionicexpansion-*.jar
