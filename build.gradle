plugins {
    id 'java'
    id 'net.neoforged.moddev' version '1.0.19'
}

version = '1.0.0'
group = 'com.ire.bionicexpansion'
base { archivesName = 'bionicexpansion' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // GeckoLib (animated 3D models)
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.1"
}

neoForge {
    version = '21.1.172'

    runs {
        client { client() }
        server { server(); programArguments.add('--nogui') }
    }

    mods {
        bionicexpansion { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
